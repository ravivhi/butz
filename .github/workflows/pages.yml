# Builds the web version of the app and publishes it with this repo's own GitHub Pages:
#   https://ravivhi.github.io/butz/            (the app)
#   https://ravivhi.github.io/butz/privacy.html (privacy policy for Google Play, from public/)
# Stand-alone: no other repo is involved. Runs on every push to main that changes the app.
name: Publish web + privacy page

on:
  push:
    branches: [main]
    paths-ignore:
      - 'store/**'
      - 'docs/**'
      - 'tests/**'
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Serve from /butz (project Pages path) for this build only
        run: node -e "const fs=require('fs'),j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/butz'};fs.writeFileSync('app.json',JSON.stringify(j,null,2))"
      - run: npx expo export -p web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
