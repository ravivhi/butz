<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Installable web app (also what the Android app in android-twa/ opens): manifest + offline service worker -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#FFC94D" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // Offline support: sw.js is written into dist/ by scripts/make-sw.mjs (not during `expo start`, so the dev
      // server is never cached). Persistent storage asks the browser not to evict the child's progress.
      if ('serviceWorker' in navigator && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    </script>
  </body>
</html>
